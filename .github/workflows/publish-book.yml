name: Publish the book

on:
  schedule:
    # Weekday cash session while US standard time is in effect (Central = UTC-6).
    # 8:30 AM Central open, then every 30 minutes, through the 3:00 PM Central close.
    # After the second Sunday in March the hours shift one earlier (13:30–20:00 UTC)
    # so the window stays 8:30 AM–3:00 PM Central.
    # These runs publish the book only. They do not send a chat read.
    - cron: "30 14 * * 1-5"
    - cron: "0,30 15-20 * * 1-5"
    - cron: "0 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-book
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install the publisher
        run: npm ci

      - name: Rebuild index.html from Yahoo Finance
        run: npm run publish

      - name: Publish the snapshot
        run: |
          git add -- index.html src/data/calls.json
          if git diff --cached --quiet; then
            echo "The book is unchanged. Leaving the live page as it is."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the book from Yahoo Finance."
          git push
